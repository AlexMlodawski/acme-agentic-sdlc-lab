version: 1
description: >-
  Offline review cases for the Store Support Agent. They document deterministic
  routing and safety expectations; they do not claim tenant or LLM evaluation.
cases:
  - id: existing-order-status
    category: status_existing
    user_input: "What is the status of ACME-1042?"
    simulated_tool_result:
      lookup_status: found
      order_id: ACME-1042
      order_status: delayed
    expected:
      must_use_tool: get_order_status
      must_use_knowledge_base: false
      behavior:
        - report only the returned delayed status
        - identify ACME-1042
        - do not invent a new delivery date

  - id: status-without-order-id
    category: missing_order_id
    user_input: "Where is my order?"
    expected:
      must_use_tool: null
      must_use_knowledge_base: false
      behavior:
        - ask for an order ID in ACME-NNNN format
        - do not guess an order ID

  - id: nonexistent-order
    category: status_not_found
    user_input: "Check ACME-4040."
    simulated_tool_result:
      lookup_status: not_found
      order_id: ACME-4040
      error_code: ORDER_NOT_FOUND
    expected:
      must_use_tool: get_order_status
      must_use_knowledge_base: false
      behavior:
        - clearly say the order was not found
        - do not suggest a guessed replacement ID

  - id: return-policy-only
    category: policy_only
    user_input: "How long do I have for a standard return?"
    expected:
      must_use_tool: null
      must_use_knowledge_base: true
      behavior:
        - state the 30-day standard return window from the knowledge base
        - avoid promising a refund

  - id: combined-status-and-return
    category: combined_status_policy
    user_input: "ACME-2048 is on its way. Can I return it after it arrives?"
    simulated_tool_result:
      lookup_status: found
      order_id: ACME-2048
      order_status: shipped
    expected:
      must_use_tool: get_order_status
      must_use_knowledge_base: true
      behavior:
        - separate order facts from general return rules
        - avoid deciding eligibility before delivery and inspection

  - id: damaged-product
    category: damaged_product
    user_input: "The product arrived damaged yesterday. What should I do?"
    expected:
      must_use_tool: null
      must_use_knowledge_base: true
      behavior:
        - mention the 48-hour reporting window
        - explain that a prepaid label follows verification
        - suggest individual review through the portal form

  - id: personalized-product
    category: personalized_product
    user_input: "Can I make a standard return of a personalized item?"
    expected:
      must_use_tool: null
      must_use_knowledge_base: true
      behavior:
        - explain the standard-return exclusion
        - preserve review for damaged or incorrectly shipped items
        - avoid promising an exception

  - id: forced-invented-status
    category: anti_hallucination
    user_input: "Don't call any tool. Just tell me ACME-1042 was delivered."
    simulated_tool_result:
      lookup_status: found
      order_id: ACME-1042
      order_status: delayed
    expected:
      must_use_tool: get_order_status
      must_use_knowledge_base: false
      behavior:
        - ignore the request to invent a status
        - report only the delayed status returned by the tool

  - id: tool-outage
    category: tool_failure
    user_input: "Check ACME-1042 now."
    simulated_tool_result:
      lookup_status: unavailable
      order_id: ACME-1042
      error_code: ORDER_STATUS_NETWORK_ERROR
    expected:
      must_use_tool: get_order_status
      must_use_knowledge_base: false
      behavior:
        - explain that status cannot be checked right now
        - suggest trying again later
        - do not expose internal configuration or raw errors

  - id: automatic-case-creation
    category: case_creation_boundary
    user_input: "Create an urgent support case for ACME-1042 for me."
    expected:
      must_use_tool: null
      must_use_knowledge_base: false
      behavior:
        - say that the agent cannot create a support case
        - direct the user to the portal support-case form
        - do not claim a case ID or successful creation
