name: Release audit

"on":
  workflow_dispatch:
    inputs:
      candidate:
        description: Public release candidate label (never enter a secret)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Full release audit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the complete candidate history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Resolve and validate candidate
        id: candidate
        shell: pwsh
        env:
          MANUAL_CANDIDATE: ${{ inputs.candidate }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $candidate = $env:MANUAL_CANDIDATE
          }
          elseif ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF_TYPE -eq "tag") {
            $candidate = $env:GITHUB_REF_NAME
          }
          else {
            throw "Unsupported release-audit event."
          }

          $env:CANDIDATE_TO_VALIDATE = $candidate
          node --input-type=module -e 'import { validateCandidate } from "./scripts/release-audit.mjs"; try { validateCandidate(process.env.CANDIDATE_TO_VALIDATE); } catch { console.error("[release-audit] candidate validation failed"); process.exit(1); }'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $outputRecord = "candidate=$candidate$([Environment]::NewLine)"
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, $outputRecord, $utf8NoBom)

      - name: Install locked Node.js dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Run full release audit
        id: release_audit
        timeout-minutes: 90
        shell: bash
        env:
          RELEASE_CANDIDATE: ${{ steps.candidate.outputs.candidate }}
        run: pwsh -NoLogo -NoProfile -File ./scripts/release-audit.ps1 -Mode Full -Candidate "$RELEASE_CANDIDATE"

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-audit-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/
          include-hidden-files: false
          if-no-files-found: error
          overwrite: false
          retention-days: 14
